# dubplate version: v0.15.0

name: go

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the dubplate build system versions binaries from git describe, which
      # needs full history and tags rather than the default shallow clone
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # the app repo's go.mod is the only place the Go version is declared
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: test
        run: go test -race ./...

      # exercises the dubplate build path, including the ldflags version stamping
      - name: build
        run: make binaries
